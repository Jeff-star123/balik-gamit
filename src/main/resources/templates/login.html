<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>BALIK GAMIT | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f0fb;
            --surface: #ffffff;
            --text-main: #1e1b2e;
            --text-sub: #64748b;
            --card-border: rgba(147, 51, 234, 0.15);
            --primary-accent: #9333ea;
            --primary-hover: #7e22ce;
            --gradient-glow: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(217, 70, 239, 0.02) 100%);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.05) 0%, transparent 40%);
        }

        .login-card { 
            background: var(--surface); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--card-border);
            background-image: var(--gradient-glow);
        }

        h2 { 
            color: var(--text-main); 
            margin-bottom: 6px; 
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        input { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            background: #faf8fd;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main) !important;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus { 
            border-color: var(--primary-accent);
            outline: none;
            background: #ffffff;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: #ffffff; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            margin-top: 15px; 
            transition: opacity 0.2s;
            font-family: inherit;
        }

        button:hover { 
            opacity: 0.9;
        }

        .register-link { 
            display: block; 
            margin-top: 20px; 
            text-decoration: none; 
            color: var(--primary-accent); 
            font-size: 0.85rem; 
            font-weight: 700; 
        }
        .register-link:hover { text-decoration: underline; }

        .forgot-link {
            text-decoration: none; 
            color: var(--text-sub); 
            font-size: 0.8rem;
        }
        .forgot-link:hover { color: var(--text-main); }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-error { background-color: rgba(220, 38, 38, 0.08); color: #dc2626; border: 1px solid rgba(220, 38, 38, 0.2); }
        .alert-success { background-color: rgba(5, 150, 105, 0.08); color: #059669; border: 1px solid rgba(5, 150, 105, 0.2); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
        .shake-error {
            animation: shake 0.4s ease-in-out;
            border-color: #dc2626 !important;
        }
    </style>
</head>
<body>
    <div class="login-card" id="loginCard">
        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your student credentials to continue.</p>
        
        <div th:if="${error}" id="errorTrigger">
            <div class="alert alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i> Invalid Student ID or Password
            </div>
        </div>

        <div th:if="${param.resetSuccess}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i> Password updated! Please login.
        </div>

        <form th:action="@{/login}" method="post">
            <input type="text" name="studentId" placeholder="Student ID" required>
            <input type="password" name="password" id="loginPass" placeholder="Password" required>
            
            <div style="text-align: left; font-size: 0.8rem; margin: 8px 0; color: var(--text-sub);">
                <label style="cursor: pointer; display: flex; align-items: center;">
                    <input type="checkbox" onclick="togglePass('loginPass')" style="width: auto; margin: 0 6px 0 0;"> 
                    Show Password
                </label>
            </div>

            <button type="submit">Login to Dashboard</button>
            <a href="/register" class="register-link">New student? Create Account</a>
        </form>

        <div style="margin-top: 15px;">
            <a href="/forgot-password" class="forgot-link">Forgot Password?</a>
        </div>
    </div>

    <script>
        function togglePass(inputId) {
            var x = document.getElementById(inputId);
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }

        window.onload = function() {
            if (document.getElementById('errorTrigger')) {
                const card = document.getElementById('loginCard');
                card.classList.add('shake-error');
            }
        };
    </script>
</body>
</html>
