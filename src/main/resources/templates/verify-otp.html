<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>BALIK GAMIT | Verify OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f0fb;
            --surface: #ffffff;
            --text-main: #1e1b2e;
            --text-sub: #64748b;
            --card-border: rgba(147, 51, 234, 0.15);
            --primary-accent: #9333ea;
            --primary-hover: #7e22ce;
            --lost-red: #dc2626;
            --found-green: #059669;
            --gradient-glow: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(217, 70, 239, 0.02) 100%);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px 12px;
            margin: 0; 
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.05) 0%, transparent 40%);
        }

        .card { 
            background: var(--surface); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--card-border);
            position: relative;
            z-index: 1;
            background-image: var(--gradient-glow);
        }

        h3 { 
            color: var(--text-main); 
            margin: 0 0 6px 0; 
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            background: #faf8fd;
            font-family: inherit;
            font-size: 1.2rem;
            letter-spacing: 5px;
            text-align: center;
            color: var(--text-main) !important;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus { 
            border-color: var(--primary-accent);
            outline: none;
            background: #ffffff;
        }

        button { 
            padding: 12px; 
            border-radius: 10px; 
            border: none; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .btn-verify { 
            width: 100%; 
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: #ffffff; 
            margin-top: 15px;
        }

        .btn-resend { 
            background-color: #faf8fd; 
            color: var(--text-main); 
            border: 1px solid var(--card-border);
            font-size: 0.85rem;
            margin-top: 5px;
            width: 100%;
        }

        button:hover:not(:disabled) { 
            opacity: 0.9;
        }

        button:disabled {
            background-color: #e2e8f0 !important;
            color: var(--text-sub);
            cursor: not-allowed;
            opacity: 0.7;
            border: none;
        }

        .resend-container { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 5px; 
            margin-top: 20px; 
        }

        #timerText { 
            font-size: 0.8rem; 
            color: var(--lost-red); 
            font-weight: 600;
        }

        .error-msg {
            background-color: rgba(220, 38, 38, 0.08);
            color: var(--lost-red);
            border: 1px solid rgba(220, 38, 38, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>Verify Identity</h3>
        <p class="subtitle">Enter the 6-digit code sent to your email.</p>
        
        <div th:if="${error}" class="error-msg">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <form th:action="@{/forgot-password/confirm-otp}" method="post">
            <input type="text" name="userOtp" placeholder="000000" required maxlength="6">
            <button type="submit" class="btn-verify">Verify Code</button>
        </form>

        <div class="resend-container">
            <p id="timerText" style="display: none;">
                Resend available in <span id="seconds">60</span>s
            </p>
            <button type="button" id="resendBtn" class="btn-resend" onclick="resendOtp()">
                <i class="fa-solid fa-rotate-right"></i> Resend OTP
            </button>
        </div>
    </div>

    <script>
        let countdown;
        function startTimer() {
            const btn = document.getElementById('resendBtn');
            const timerText = document.getElementById('timerText');
            const sec = document.getElementById('seconds');
            
            btn.disabled = true; 
            timerText.style.display = "block";
            let timeLeft = 60;
            
            countdown = setInterval(() => {
                timeLeft--; 
                sec.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    btn.disabled = false; 
                    timerText.style.display = "none";
                }
            }, 1000);
        }

        function resendOtp() {
            fetch('/forgot-password/send-otp-resend', { method: 'POST' })
                .then(res => {
                    if(res.ok) {
                        alert("New OTP Sent! Please check your email.");
                        startTimer();
                    } else {
                        alert("Error resending OTP. Please try again.");
                    }
                });
        }
        
        window.onload = startTimer;
    </script>
</body>
</html>
