<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>BALIK GAMIT | Set New Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f0fb;
            --surface: #ffffff;
            --text-main: #1e1b2e;
            --text-sub: #64748b;
            --card-border: rgba(147, 51, 234, 0.15);
            --primary-accent: #9333ea;
            --primary-hover: #7e22ce;
            --lost-red: #dc2626;
            --found-green: #059669;
            --gradient-glow: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(217, 70, 239, 0.02) 100%);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px 12px;
            margin: 0; 
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.05) 0%, transparent 40%);
        }

        .card { 
            background: var(--surface); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--card-border);
            position: relative;
            z-index: 1;
            background-image: var(--gradient-glow);
        }

        h2 { 
            color: var(--text-main); 
            margin: 0 0 6px 0; 
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input[type="password"], 
        input[type="text"] { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            background: #faf8fd;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main) !important;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus { 
            border-color: var(--primary-accent);
            outline: none;
            background: #ffffff;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: #ffffff; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            margin-top: 15px; 
            transition: opacity 0.2s;
            font-family: inherit;
        }

        button:hover { 
            opacity: 0.9;
        }

        .match-error { 
            background-color: rgba(220, 38, 38, 0.08);
            color: var(--lost-red);
            border: 1px solid rgba(220, 38, 38, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none; 
            margin: 8px 0; 
            text-align: left;
        }

        .checkbox-container {
            text-align: left; 
            font-size: 0.8rem; 
            margin: 8px 0; 
            color: var(--text-sub);
        }

        label { cursor: pointer; display: flex; align-items: center; }
        input[type="checkbox"] { width: auto; margin: 0 6px 0 0; cursor: pointer; }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Secure Account</h2>
        <p class="subtitle">Create a strong password for your account.</p>
        
        <form th:action="@{/forgot-password/verify}" method="post" onsubmit="return validatePasswords()">
            <input type="password" name="newPassword" id="newPass" placeholder="New Password" required>
            <input type="password" id="confirmPass" placeholder="Confirm New Password" required>
            
            <p id="matchError" class="match-error">
                <i class="fa-solid fa-circle-exclamation"></i> Passwords do not match!
            </p>

            <div class="checkbox-container">
                <label>
                    <input type="checkbox" onclick="toggleVisibility()"> 
                    Show Passwords
                </label>
            </div>

            <button type="submit">Update Password</button>
        </form>
    </div>

    <script>
        function toggleVisibility() {
            const p1 = document.getElementById("newPass");
            const p2 = document.getElementById("confirmPass");
            const type = p1.type === "password" ? "text" : "password";
            p1.type = type;
            p2.type = type;
        }

        function validatePasswords() {
            const pass = document.getElementById("newPass").value;
            const confirm = document.getElementById("confirmPass").value;
            const errorMsg = document.getElementById("matchError");

            if (pass !== confirm) {
                errorMsg.style.display = "block";
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
