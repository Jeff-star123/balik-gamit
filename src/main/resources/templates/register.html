<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>BALIK GAMIT | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f0fb;
            --surface: #ffffff;
            --text-main: #1e1b2e;
            --text-sub: #64748b;
            --card-border: rgba(147, 51, 234, 0.15);
            --primary-accent: #9333ea;
            --primary-hover: #7e22ce;
            --found-green: #059669;
            --lost-red: #dc2626;
            --gradient-glow: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(217, 70, 239, 0.02) 100%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            padding: 20px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.05) 0%, transparent 40%);
        }

        .register-card {
            background: var(--surface);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.08);
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--card-border);
            text-align: center;
            position: relative;
            z-index: 1;
            background-image: var(--gradient-glow);
        }

        h2 {
            font-weight: 800;
            font-size: 1.6rem;
            color: var(--text-main);
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            background: #faf8fd;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main) !important;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus {
            border-color: var(--primary-accent);
            outline: none;
            background: #ffffff;
        }

        .email-field-group {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        #sendOtpBtn {
            width: auto !important;
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: #ffffff;
            padding: 0 18px;
            height: 44px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #sendOtpBtn:hover { opacity: 0.9; }

        #finalRegisterBtn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            margin-top: 15px;
            display: none; 
        }
        #finalRegisterBtn:hover { opacity: 0.9; }

        button:disabled {
            background: #e2e8f0;
            color: var(--text-sub);
            cursor: not-allowed;
        }

        .login-link {
            display: block;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--primary-accent);
            text-decoration: none;
            font-weight: 700;
        }
        .login-link:hover { text-decoration: underline; }

        #id-status {
            display: block;
            font-size: 0.75rem;
            text-align: left;
            margin-bottom: 4px;
            padding-left: 4px;
            font-weight: 600;
        }

        #otpSection {
            display: none; 
            margin-top: 6px;
        }

        .checking-spinner {
            display: inline-block;
            width: 10px; height: 10px;
            border: 2px solid rgba(147, 51, 234, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-accent);
            animation: spin 0.8s linear infinite;
            margin-right: 4px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .pass-req-box {
            text-align: left;
            font-size: 0.75rem;
            margin: 4px 0 12px 4px;
            color: var(--text-sub);
        }
        .req-item { transition: 0.2s; margin-bottom: 2px; }
        .req-valid { color: var(--found-green); font-weight: 600; }
        .req-invalid { color: var(--lost-red); }

        /* CENTRAL NOTIFICATION MODAL */
        #central-notif-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(30, 27, 46, 0.5);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .figma-modal {
            background: var(--surface);
            padding: 30px 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(147, 51, 234, 0.15);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .figma-modal.active { transform: scale(1); opacity: 1; }

        .modal-icon-container {
            width: 60px; height: 60px;
            background: rgba(5, 150, 105, 0.1);
            color: var(--found-green);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 16px;
        }

        .modal-content h3 { margin: 0 0 6px 0; font-size: 1.3rem; font-weight: 700; color: var(--text-main); }
        .modal-content p { margin: 0 0 20px 0; color: var(--text-sub); font-size: 0.9rem; }

        .modal-btn {
            width: 100%; padding: 12px; background: linear-gradient(135deg, #9333ea, #a855f7); color: #ffffff; border: none;
            border-radius: 10px; font-weight: 700; cursor: pointer;
        }
        .modal-btn:hover { opacity: 0.9; }

        @media (max-width: 480px) {
            .register-card {
                padding: 28px 18px;
            }
            .email-field-group {
                flex-direction: column;
                align-items: stretch;
            }
            #sendOtpBtn {
                width: 100% !important;
                height: 42px;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

    <div id="central-notif-overlay">
        <div id="central-modal" class="figma-modal">
            <div class="modal-icon-container">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <div class="modal-content">
                <h3 id="notif-title">Success!</h3>
                <p id="notif-message">Code has been sent to your email.</p>
            </div>
            <button class="modal-btn" onclick="closeCentralNotif()">Okay, got it!</button>
        </div>
    </div>

    <div class="register-card">
        <h2>Join Us</h2>
        <p class="subtitle">Create your student account to get started.</p>
        
        <div th:if="${error}" style="background: rgba(220, 38, 38, 0.08); color: var(--lost-red); border: 1px solid rgba(220, 38, 38, 0.2); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 0.8rem; font-weight: 600; text-align: left;">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span>
        </div>
        
        <form th:action="@{/register/send-otp}" method="post" id="regForm" onsubmit="return validatePasswords()">
            
            <input type="text" name="studentId" id="studentId" placeholder="Student ID" required oninput="checkIdAvailability()">
            <span id="id-status"></span>

            <input type="text" name="name" placeholder="Full Name" required>

            <div class="email-field-group">
                <input type="email" id="email" name="email" placeholder="Institutional Email" required>
                <button type="button" id="sendOtpBtn" onclick="requestRegistrationOtp()">Send Code</button>
            </div>

            <p id="timerText" style="font-size: 0.75rem; color: var(--lost-red); margin: 4px 0 8px 0; display: none; text-align: left; font-weight: 600;">
                Resend available in <span id="seconds">60</span>s
            </p>

            <div id="otpSection">
                <input type="text" name="userOtp" placeholder="Enter 6-Digit OTP" required maxlength="6">
            </div>

            <input type="password" name="password" id="regPass" placeholder="Create Password" required onkeyup="checkPasswordStrength()">
            
            <div class="pass-req-box">
                <div id="req-len" class="req-item">✖ Minimum 10 characters</div>
                <div id="req-num" class="req-item">✖ At least one number</div>
                <div id="req-spec" class="req-item">✖ Special character (@#$%^&+=!)</div>
                <div id="req-case" class="req-item">✖ Mixed case (Upper & Lower)</div>
            </div>

            <input type="password" id="confirmPass" placeholder="Confirm Password" required onkeyup="checkMatch()">
            
            <p id="matchError" style="color: var(--lost-red); font-size: 0.75rem; display: none; margin: 4px 0; text-align: left; font-weight: 600;">
                ⚠️ Passwords do not match!
            </p>

            <div style="text-align: left; font-size: 0.8rem; margin: 8px 0; color: var(--text-sub);">
                <label style="cursor: pointer; display: flex; align-items: center;">
                    <input type="checkbox" onclick="togglePassFields()" style="width: auto; margin: 0 6px 0 0;"> 
                    Show Passwords
                </label>
            </div>

            <button type="submit" id="finalRegisterBtn">Verify & Register</button>
        </form>

        <a th:href="@{/login}" class="login-link">Already have an account? Log in</a>

        <script>
            let countdown;

            function checkPasswordStrength() {
                const pass = document.getElementById('regPass').value;
                const isLen = pass.length >= 10;
                const isNum = /\d/.test(pass);
                const isSpec = /[@#$%^&+=!]/.test(pass);
                const isCase = /[a-z]/.test(pass) && /[A-Z]/.test(pass);

                updateRequirementDisplay('req-len', isLen, "Minimum 10 characters");
                updateRequirementDisplay('req-num', isNum, "At least one number");
                updateRequirementDisplay('req-spec', isSpec, "Special character (@#$%^&+=!)");
                updateRequirementDisplay('req-case', isCase, "Mixed case (Upper & Lower)");
            }

            function updateRequirementDisplay(id, isValid, text) {
                const el = document.getElementById(id);
                el.className = isValid ? 'req-item req-valid' : 'req-item req-invalid';
                el.innerHTML = (isValid ? '✅ ' : '✖ ') + text;
            }

            function checkMatch() {
                const pass = document.getElementById('regPass').value;
                const confirm = document.getElementById('confirmPass').value;
                document.getElementById('matchError').style.display = (pass === confirm || confirm === "") ? 'none' : 'block';
            }

            function showCentralNotif(title, message, iconClass = 'fa-paper-plane') {
                const overlay = document.getElementById('central-notif-overlay');
                const modal = document.getElementById('central-modal');
                const icon = modal.querySelector('.modal-icon-container i');
                
                document.getElementById('notif-title').innerText = title;
                document.getElementById('notif-message').innerText = message;
                icon.className = `fa-solid ${iconClass}`;

                overlay.style.display = 'flex';
                setTimeout(() => { modal.classList.add('active'); }, 10);
            }

            function closeCentralNotif() {
                const modal = document.getElementById('central-modal');
                modal.classList.remove('active');
                setTimeout(() => {
                    document.getElementById('central-notif-overlay').style.display = 'none';
                }, 300);
            }

            function requestRegistrationOtp() {
                const email = document.getElementById('email').value;
                const btn = document.getElementById('sendOtpBtn');
                const timerText = document.getElementById('timerText');
                const secondsSpan = document.getElementById('seconds');
                const otpSection = document.getElementById('otpSection');
                const finalBtn = document.getElementById('finalRegisterBtn');

                if (!email || !email.includes('@')) {
                    showCentralNotif('Invalid Email', 'Please use your valid institutional email address.', 'fa-circle-xmark');
                    return;
                }

                btn.disabled = true;

                fetch('/send-otp?email=' + email, { method: 'POST' })
                    .then(res => res.text())
                    .then(data => {
                        if (data === "SKIP") {
                            showCentralNotif('Verification Paused', 'Email verification is currently disabled. You may proceed.', 'fa-circle-check');
                            otpSection.style.display = "none"; 
                            document.getElementsByName('userOtp')[0].value = "000000"; 
                            finalBtn.style.display = "block";
                            finalBtn.innerText = "Register Now";
                        } else if (data === "OK") {
                            showCentralNotif('Code Sent!', 'Check your inbox for the 6-digit code.', 'fa-envelope-circle-check');
                            otpSection.style.display = "block";
                            finalBtn.style.display = "block";
                            
                            timerText.style.display = "block";
                            let timeLeft = 60;
                            countdown = setInterval(() => {
                                timeLeft--;
                                secondsSpan.innerText = timeLeft;
                                if (timeLeft <= 0) {
                                    clearInterval(countdown);
                                    btn.disabled = false;
                                    timerText.style.display = "none";
                                }
                            }, 1000);
                        } else {
                            showCentralNotif('Error', 'Could not send OTP.', 'fa-triangle-exclamation');
                            btn.disabled = false;
                        }
                    });
            }

            function togglePassFields() {
                var p1 = document.getElementById("regPass");
                var p2 = document.getElementById("confirmPass");
                var type = p1.type === "password" ? "text" : "password";
                p1.type = type; p2.type = type;
            }

            function validatePasswords() {
                var pass = document.getElementById("regPass").value;
                var confirm = document.getElementById("confirmPass").value;
                var strongRegex = /^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).{10,}$/;

                if (!strongRegex.test(pass)) {
                    showCentralNotif('Weak Password', 'Please follow all security requirements for your password.', 'fa-shield-halved');
                    return false;
                }

                if (pass !== confirm) {
                    document.getElementById("matchError").style.display = "block";
                    return false;
                }
                return true;
            }

            function checkIdAvailability() {
                const studentId = document.getElementById('studentId').value;
                const idStatus = document.getElementById('id-status');

                if (studentId.length === 9) {
                    idStatus.innerHTML = '<span class="checking-spinner"></span> Checking...';
                    idStatus.style.color = 'var(--primary-accent)';

                    fetch('/check-id?studentId=' + studentId)
                        .then(res => res.json())
                        .then(isAvailable => {
                            if (isAvailable) {
                                idStatus.innerHTML = '✅ ID is available';
                                idStatus.style.color = 'var(--found-green)';
                            } else {
                                idStatus.innerHTML = '❌ ID is already taken';
                                idStatus.style.color = 'var(--lost-red)';
                            }
                        });
                } else {
                    idStatus.innerHTML = '';
                }
            }
        </script>
    </div>
</body>
</html>
