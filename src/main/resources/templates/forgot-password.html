<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>BALIK GAMIT | Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #f4f0fb;
            --surface: #ffffff;
            --text-main: #1e1b2e;
            --text-sub: #64748b;
            --card-border: rgba(147, 51, 234, 0.15);
            --primary-accent: #9333ea;
            --primary-hover: #7e22ce;
            --lost-red: #dc2626;
            --found-green: #059669;
            --gradient-glow: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(217, 70, 239, 0.02) 100%);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-main);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px 12px;
            margin: 0; 
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(147, 51, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(217, 70, 239, 0.05) 0%, transparent 40%);
        }

        .card { 
            background: var(--surface); 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.08); 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            border: 1px solid var(--card-border);
            position: relative;
            z-index: 1;
            background-image: var(--gradient-glow);
        }

        h2 { 
            color: var(--text-main); 
            margin: 0 0 6px 0; 
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border: 1px solid var(--card-border); 
            border-radius: 10px; 
            background: #faf8fd;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main) !important;
            box-sizing: border-box;
            transition: border-color 0.2s, background 0.2s;
        }

        input:focus { 
            border-color: var(--primary-accent);
            outline: none;
            background: #ffffff;
        }

        button { 
            width: 100%; 
            padding: 12px; 
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 0.95rem;
            cursor: pointer; 
            margin-top: 15px; 
            transition: opacity 0.2s;
            font-family: inherit;
        }

        button:hover { 
            opacity: 0.9;
        }

        .error-box { 
            color: var(--lost-red); 
            background: rgba(220, 38, 38, 0.08); 
            border: 1px solid rgba(220, 38, 38, 0.2);
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 0.8rem;
            font-weight: 600;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link { 
            display: inline-block;
            margin-top: 20px; 
            text-decoration: none; 
            color: var(--text-sub); 
            font-size: 0.85rem; 
            font-weight: 600; 
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--text-main); }

        #central-notif-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(30, 27, 46, 0.5);
            backdrop-filter: blur(6px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .figma-modal {
            background: var(--surface);
            padding: 30px 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(147, 51, 234, 0.15);
            border: 1px solid var(--card-border);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .figma-modal.active {
            transform: scale(1);
            opacity: 1;
        }

        .modal-icon-container {
            width: 60px;
            height: 60px;
            background: rgba(5, 150, 105, 0.1);
            color: var(--found-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 16px;
        }

        .modal-content h3 {
            margin: 0 0 6px 0;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .modal-content p {
            margin: 0 0 20px 0;
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-btn:hover { opacity: 0.9; }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div id="central-notif-overlay">
        <div id="central-modal" class="figma-modal">
            <div class="modal-icon-container">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <div class="modal-content">
                <h3 id="notif-title">Success!</h3>
                <p id="notif-message">Request has been sent.</p>
            </div>
            <button class="modal-btn" onclick="closeCentralNotif()">Okay, got it!</button>
        </div>
    </div>

    <div class="card">
        <h2>Reset Access</h2>
        
        <div th:if="${error}" class="error-box">
            <i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}">Error Message</span>
        </div>

        <p class="subtitle">
            Enter your registered email and we'll send you a secure 6-digit code to reset your password.
        </p>

        <form id="resetForm" th:action="@{/forgot-password/send-otp}" method="post">
            <input type="email" name="email" id="emailInput" placeholder="Institutional Email" required>
            <button type="submit">Get Reset Code</button>
        </form>

        <div style="margin-top: 10px;">
            <a href="/login" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        function showCentralNotif(title, message, iconClass = 'fa-paper-plane') {
            const overlay = document.getElementById('central-notif-overlay');
            const modal = document.getElementById('central-modal');
            const icon = modal.querySelector('.modal-icon-container i');
            
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-message').innerText = message;
            icon.className = `fa-solid ${iconClass}`;

            overlay.style.display = 'flex';
            setTimeout(() => { modal.classList.add('active'); }, 10);
        }

        function closeCentralNotif() {
            const modal = document.getElementById('central-modal');
            modal.classList.remove('active');
            setTimeout(() => {
                document.getElementById('central-notif-overlay').style.display = 'none';
                document.getElementById('resetForm').submit();
            }, 300);
        }

        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            if(email) {
                showCentralNotif(
                    "Request Sent", 
                    "We are sending a 6-digit reset code to " + email + ". Please check your inbox shortly.",
                    "fa-envelope-circle-check"
                );
            }
        });
    </script>
</body>
</html>
